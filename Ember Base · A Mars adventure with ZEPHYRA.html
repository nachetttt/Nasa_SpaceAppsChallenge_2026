body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(25,12,45,.55),rgba(25,12,45,.15) 35%,rgba(25,12,45,.7));pointer-events:none}
#app{position:relative;max-width:780px;margin:0 auto;padding:18px 14px 70px}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:.1em 0 .3em;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.35)}
h1{font-size:3rem;font-weight:800}h2{font-size:1.7rem;font-weight:800}h3{font-size:1.2rem;font-weight:800}
.glass{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1.5px solid var(--line);border-radius:30px;padding:20px;margin:16px 0;box-shadow:0 12px 34px rgba(0,0,0,.3)}
.mute{color:var(--mute);font-size:.9rem}
.dots{display:flex;gap:8px;justify-content:center;margin:2px 0 8px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.28)}.dots i.on{background:var(--peach);box-shadow:0 0 12px var(--peach)}.dots i.cur{transform:scale(1.4);background:#fff}
.zrow{display:flex;align-items:center;gap:6px;margin:12px 0}
.zimg{width:128px;flex:none;animation:bob 4.5s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(120,200,255,.55))}
@keyframes bob{50%{transform:translateY(-9px) rotate(-2deg)}}
.bub{position:relative;flex:1;background:#fffaf0;color:#33274f;border-radius:26px;padding:12px 18px 14px;box-shadow:0 8px 24px rgba(0,0,0,.28);cursor:pointer}
.bub::before{content:"";position:absolute;left:-11px;top:34px;width:24px;height:24px;background:#fffaf0;transform:rotate(45deg);border-radius:5px}
.bub .nm{font-family:'Baloo 2';font-weight:800;color:#3b8fcf;font-size:.95rem}
.bub p{margin:2px 0 0}.bub small{display:block;margin-top:6px;color:#6d5f8c}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:rgba(255,255,255,.12);color:var(--ink);border:2px solid var(--line);border-radius:24px;padding:12px 16px;margin:11px 0;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.opt:hover,.opt:focus-visible{transform:translateY(-3px);border-color:var(--peach);background:rgba(255,255,255,.2);outline:none}
.opt.on{border-color:var(--peach);background:rgba(255,178,122,.25)}
.opt .em{flex:none;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:1.6rem}
.go{display:block;width:100%;border:0;border-radius:999px;padding:15px;margin:16px 0;font:inherit;font-family:'Baloo 2';font-weight:800;font-size:1.3rem;color:#4a1d2e;background:linear-gradient(135deg,#ffd36b,#ff9a7a);box-shadow:0 8px 22px rgba(255,140,110,.5);cursor:pointer}
.go:hover{filter:brightness(1.06)}.go:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:9px}
.chip{background:rgba(255,255,255,.14);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
.chip.on{border-color:var(--peach);background:rgba(255,178,122,.3)}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.3)}.sw.on{border-color:#fff;transform:scale(1.12)}
input[type=text]{width:100%;background:rgba(255,255,255,.14);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font:inherit;font-weight:800}
input::placeholder{color:var(--mute)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;text-align:center}
.ring{--p:0;--c:#fff;width:86px;height:86px;margin:0 auto 4px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.18) 0);display:grid;place-items:center;transition:--p 1.1s;box-shadow:0 0 18px color-mix(in srgb,var(--c) 40%,transparent)}
.ring div{width:68px;height:68px;border-radius:50%;background:#2b1d4a;display:grid;place-items:center;font-size:1.8rem}
.ring.odd{animation:wob .6s infinite alternate}@keyframes wob{to{transform:rotate(6deg)}}
.rings b{display:block;font-size:.95rem;line-height:1.1}.rings small{color:var(--mute)}
.adv{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.adv i{flex:none;font-style:normal;font-size:1.5rem;background:rgba(255,255,255,.18);border-radius:50%;width:42px;height:42px;display:grid;place-items:center}
.adv p{margin:0;background:rgba(255,255,255,.14);border-radius:18px;padding:8px 14px;font-size:.95rem}
.arrow{display:inline-block;margin:3px 6px 3px 0;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:800}
.up{color:#8dffb4}.dn{color:#ffa08f}
.paper{background:#fff6dc;color:#3a2c18;border-radius:8px 22px 8px 22px;padding:20px 22px;font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:1.3rem;line-height:1.5;box-shadow:0 10px 26px rgba(0,0,0,.35);transform:rotate(-.6deg);margin:14px 0;background-image:repeating-linear-gradient(transparent 0 30px,rgba(200,160,100,.25) 30px 31px)}
.arena{position:relative;height:360px;border-radius:30px;overflow:hidden;border:2px solid var(--line);background:radial-gradient(circle at 30% 20%,rgba(255,190,120,.45),transparent 50%),radial-gradient(circle at 80% 70%,rgba(255,110,90,.4),transparent 55%),rgba(90,35,45,.6);touch-action:manipulation}
.it{position:absolute;top:-70px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;cursor:pointer;user-select:none;background:rgba(255,255,255,.28);box-shadow:0 0 20px rgba(255,255,255,.6);animation:fall 2.9s linear forwards}
.it.bad{background:rgba(255,230,80,.35);box-shadow:0 0 20px #ffe44d}
@keyframes fall{to{top:370px}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{aspect-ratio:1;border-radius:22px;border:2px solid var(--line);background:rgba(255,255,255,.14);font:inherit;font-size:1.8rem;color:var(--ink);cursor:pointer}.tile.dust{background:#8a5a3c}.tile.done{background:rgba(143,224,255,.38)}input[type=range]{width:100%;accent-color:#ffb27a;margin:14px 0}.note{font-size:.8rem;color:var(--mute);text-align:center}
.hero{display:flex;gap:16px;align-items:center}
@media (max-width:520px){.zimg{width:92px}.ring{width:76px;height:76px}.ring div{width:60px;height:60px}h1{font-size:2.4rem}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}.it{animation-duration:4s!important}}
</style>
</head>

{i:'🍅',t:'Light only the tomatoes and let the herbs nap',fx:{f:6,e:-4,t:-3},r:'Tomatoes win! The herb fans on the crew grumble.'},

{t:'The Whistling Wall',i:'🌬️',x:'A thin whistle is coming from Module B. Breezy, your air, is sneaking out through a tiny crack.',a:[['🤖 Kip','Beep! Leaks grow when you ignore them.'],['🩺 Dr. Lux','Don’t stay outside too long. Radiation is higher out there.']],l:'even a tiny leak matters in space: you measure it, fix it, then measure again',c:[

const DAYS=[{ev:[0,1,11]},{ev:[2,3,10]},{ev:[12],st:30},{ev:[4,5,9]},{ev:[8],st:45},{ev:[6,7]},{st:60}];
const FACTS=['DONKI is NASA’s space-weather notebook. Scientists log flares, solar particle storms and coronal mass ejections there.','RadLab shows radiation readings in units like µSv per hour, collected by instruments on the space station and beyond.','Mars Trek is a NASA website where anyone can explore Mars maps and data from landing sites.','NASA’s open APIs let students download real space data, like pictures and space-weather reports.','Radiation instruments have names like TEPC and Liulin, but they all measure how much radiation passes through.','Spacecraft watch the Sun’s flares, including MAVEN, which circles Mars.','NASA’s OSDR shares space biology experiments so scientists everywhere can learn from them.'];
const ZL=['Good morning, explorer! I’m ZEPHYRA, the voice of Ember Base. I’ve waited a long time for someone to talk to. Here’s today’s report!','Sunny is awake and Splash is hiding in the ice. Let’s see what Mars has in store!','My sensors feel a storm coming! Grab supplies before it hits!','Mars is chilly and dusty today. Keep our crew cheerful!','Another storm! You were so brave last time. Let’s do it again!','The crew is tired but proud. Big decisions today.','Last day! Whatever happens, I’m proud to be your base.'];
let S0={name:'',col:'#ff6b6b',emb:'🦊',ori:'t',dest:'Mom'},S;
const clamp=v=>Math.max(0,Math.min(100,Math.round(v))),rnd=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const ap=fx=>{for(const k in fx)S.r[k]=clamp(S.r[k]+fx[k])};
const diff=b=>R.map(x=>{const d=S.r[x[0]]-b[x[0]];return d?`<span class="arrow ${d>0?'up':'dn'}">${x[3]} ${d>0?'▲':'▼'}</span>`:''}).join('');
const zeph=(t,more='')=>`<div class="zrow"><img class="zimg" src="${ZI}" alt="ZEPHYRA, the sky dragon"><div class="bub"><span class="nm">ZEPHYRA</span><p class="tw" data-t="${t}"></p>${more}</div></div>`;
const dots=()=>`<div class="dots">${[0,1,2,3,4,5,6].map(i=>`<i class="${i==S.day?'cur':i<S.day?'on':''}"></i>`).join('')}</div>`;
function draw(h){app.innerHTML=h;window.scrollTo(0,0);const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
document.querySelectorAll('.tw').forEach(p=>{const t=p.dataset.t;p.textContent=t;if(rm)return;p.style.minHeight=p.offsetHeight+'px';p.textContent='';let i=0;const id=setInterval(()=>{i+=2;p.textContent=t.slice(0,i);if(i>=t.length)clearInterval(id)},22);p.closest('.bub').onclick=()=>{clearInterval(id);p.textContent=t}})}
const avatar=()=>`<svg width="104" height="104" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="64" r="44" fill="${S0.col}"/><circle cx="60" cy="54" r="31" fill="#2b1d4a" stroke="#fff7ec" stroke-width="5"/><path d="M40 46q14-16 34-4" stroke="#8fe0ff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/><text x="60" y="64" font-size="26" text-anchor="middle">${S0.emb}</text><circle cx="40" cy="104" r="9" fill="${S0.col}"/><circle cx="80" cy="104" r="9" fill="${S0.col}"/></svg>`;
const pro=()=>`${S0.name||'You'}! ${ORI[S0.ori].t} One night a strange glow crossed the sky. It was ZEPHYRA, the sky-dragon AI of Ember Base on Mars, calling for help: “My lights are on, but my crew needs a leader. Will you come?” You zipped up your ${COL.find(c=>c[1]==S0.col)[0]} suit, pinned on your ${S0.emb} badge and answered: “I’m coming!”`;

function setup(){
draw(`<h1>Ember Base</h1><p class="mute">A Mars survival adventure for brave explorers</p>
${zeph('Hi there! I’m ZEPHYRA, a sky dragon made of wind and stars. Let’s build your astronaut first!')}
<div class="glass"><div class="hero"><div>${avatar()}</div><div style="flex:1"><h3>Your name</h3><input id="nm" type="text" maxlength="14" placeholder="Type your name" value="${S0.name}"></div></div>
<p class="mute">Suit color</p><div class="row">${COL.map(c=>`<button class="sw ${S0.col==c[1]?'on':''}" data-k="col" data-v="${c[1]}" style="background:${c[1]}" aria-label="${c[0]}"></button>`).join('')}</div>
<p class="mute">Your badge</p><div class="row">${EMB.map(e=>`<button class="chip ${S0.emb==e?'on':''}" data-k="emb" data-v="${e}">${e}</button>`).join('')}</div>
<p class="mute">Where did your curiosity start? (This gives you a small head start.)</p>${Object.entries(ORI).map(([k,o])=>`<button class="opt ${S0.ori==k?'on':''}" data-k="ori" data-v="${k}"><span class="em">${o.i}</span><span><b>${o.n}</b><br><small class="mute">${o.t}</small></span></button>`).join('')}
<p class="mute">Who will you write letters to?</p><div class="row">${DEST.map(d=>`<button class="chip ${S0.dest==d?'on':''}" data-k="dest" data-v="${d}">${d}</button>`).join('')}</div></div>
<div class="glass"><h3>Your story</h3><p id="pr">${pro()}</p></div><button class="go" id="go">Launch to Mars! 🚀</button><p class="note">Facts inspired by NASA’s DONKI, RadLab, OSDR, Mars Trek and Open APIs. This is a student project, not an official NASA product.</p>`);
document.getElementById('nm').oninput=e=>{S0.name=e.target.value.replace(/[<>"&]/g,'');document.getElementById('pr').textContent=pro()};
app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S0[b.dataset.k]=b.dataset.v;S0.name=document.getElementById('nm').value.replace(/[<>"&]/g,'');setup()});
document.getElementById('go').onclick=()=>{S0.name=S0.name.trim()||'Explorer';start()}}

function start(){S={day:0,step:0,pend:[],log:[],letters:[],r:{e:65,w:65,o:70,f:65,s:50,t:60}};S.r[ORI[S0.ori].b]+=12;dawn()}

function dawn(){
const d=S.day,msgs=[];
if(d>0)ap({o:-6,w:-5,f:-5,e:d<3?4:-10});
S.pend=S.pend.filter(p=>{if(p.day<=d){ap(p.fx);msgs.push(p.m);return false}return true});
const dead=['e','w','o','f','t'].find(k=>S.r[k]<=0);if(dead)return end(dead);
const un=['e','w','o','f','s'][rnd(0,4)],low=R.filter(x=>S.r[x[0]]<30).map(x=>x[2]);
draw(`${dots()}<h2>Day ${d+1} · Morning report</h2>${zeph(ZL[d]+' '+msgs.map(m=>'↳ '+m).join(' ')+(low.length?` ${low.join(' and ')} sound very weak today.`:''))}
<div class="glass"><div class="rings">${R.map(x=>{const v=S.r[x[0]],sh=x[0]==un?clamp(v+rnd(-9,9)):v;return `<div><div class="ring ${x[0]==un?'odd':''}" style="--c:${x[4]};--p:${sh}"><div>${x[3]}</div></div><b>${x[1]}</b><small>${x[2]} ${x[0]==un?'≈':''}${sh}%</small></div>`}).join('')}</div>
<p class="mute" style="margin-top:14px">One sensor is blinking oddly today. ZEPHYRA isn’t sure which one! Numbers with ≈ could be wrong.</p><p>📰 <b>NASA fact:</b> ${FACTS[d]}</p></div><button class="go" id="n">Start the day</button>`);
document.getElementById('n').onclick=()=>{S.step=0;next()}}

function next(){const D=DAYS[S.day];if(D.ev&&S.step<D.ev.length)return event(D.ev[S.step]);if(D.st)return storm(D.st);night()}

function event(i){const E=EV[i];
draw(`${dots()}<h2>${E.i} ${E.t}</h2><div class="glass"><p>${E.x}</p><h3>Ask your crew</h3>${E.a.map(a=>`<div class="adv"><i>${a[0].split(' ')[0]}</i><p><b>${a[0].split(' ').slice(1).join(' ')}:</b> ${a[1]}</p></div>`).join('')}</div>
<div class="glass"><h3>What will you do?</h3>${E.c.map((c,j)=>`<button class="opt" data-j="${j}"><span class="em">${c.i}</span><span>${c.t}</span></button>`).join('')}<p class="mute">There’s no perfect answer. Even ZEPHYRA can’t be sure what will happen!</p></div>`);
app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{const c=E.c[b.dataset.j],bf={...S.r};ap(c.fx);let ex='';
if(c.k&&Math.random()<c.k.p){ap(c.k.fx);ex=' '+c.k.m}
if(c.d)S.pend.push({day:S.day+c.d.n,fx:c.d.fx,m:c.d.m});
S.log.push({e:i,t:c.t});
const fin=sc=>{if(sc!==null){const bo={};for(const k in c.bonus)bo[k]=Math.round(c.bonus[k]*sc);ap(bo);ex+=` Mini-game score: ${Math.round(sc*100)}%!`}
draw(`${dots()}<h2>${E.i} ${E.t}</h2><div class="glass"><p>You chose: <b>${c.t}</b></p></div>${zeph(c.r+ex,'<small>Some effects might show up later...</small>')}<div class="glass">${diff(bf)||'<span class="mute">Nothing changed right away.</span>'}</div><button class="go" id="n">Continue</button>`);
document.getElementById('n').onclick=()=>{S.step++;next()}};
c.mg?MG[c.mg](fin):fin(null)})}
const mini=(h,d,f)=>{draw(`${dots()}<h2>${h}</h2>${zeph(d)}<div class="glass" id="mg"></div>`);f(document.getElementById('mg'))};
const MG={
wipe(cb){mini('🧹 Dust wipe','Tap every dusty panel before time runs out!',b=>{let t=8,n=0,id;b.innerHTML=`<p class="mute">Time: <b id="mt">8</b></p><div class="grid">${Array(12).fill('<button class="tile dust">🟫</button>').join('')}</div>`;
const end=()=>{clearInterval(id);cb(n/12)};
b.querySelectorAll('.tile').forEach(x=>x.onclick=()=>{if(x.classList.contains('done'))return;x.classList.add('done');x.textContent='✨';if(++n==12)end()});
id=setInterval(()=>{document.getElementById('mt').textContent=--t;if(t<=0)end()},1000)})},
ice(cb){mini('🧊 Ice radar','Your rover can scan 6 spots. Three of them hide ice under the dust. Find it!',b=>{let s=6,f=0;const ic=new Set();while(ic.size<3)ic.add(rnd(0,11));
b.innerHTML=`<p class="mute">Scans left: <b id="sl">6</b></p><div class="grid">${Array(12).fill('<button class="tile dust">❓</button>').join('')}</div>`;
b.querySelectorAll('.tile').forEach((x,i)=>x.onclick=()=>{if(x.classList.contains('done')||s<=0)return;x.classList.add('done');const h=ic.has(i);if(h)f++;x.textContent=h?'🧊':'🪨';document.getElementById('sl').textContent=--s;if(s<=0||f==3)setTimeout(()=>cb(f/3),700)})})},
cast(cb){mini('🔭 Forecast','DONKI’s model says the cloud arrives in 36 to 60 hours. Guess when it will hit!',b=>{b.innerHTML=`<p>Your guess: <b id="gv">48</b> hours</p><input id="rg" type="range" min="24" max="72" value="48" aria-label="Hours until arrival"><button class="go" id="lk">Lock in my guess</button>`;const r=document.getElementById('rg');r.oninput=()=>document.getElementById('gv').textContent=r.value;
document.getElementById('lk').onclick=()=>{const a=rnd(36,60),g=+r.value,sc=Math.max(0,1-Math.abs(g-a)/12);b.innerHTML=`<p>The cloud arrived after <b>${a} hours</b>. You guessed <b>${g}</b>. Real forecasts can be off, too!</p><button class="go" id="ct">Continue</button>`;document.getElementById('ct').onclick=()=>cb(sc)}})},
dose(cb){mini('📟 Dose detectives','Tap the rooms from the LOWEST to the HIGHEST radiation reading. These are practice numbers!',b=>{const rm=[['🌱 Greenhouse',31],['🔬 Lab',18],['🛏️ Sleep pod',9],['🔧 Workshop',24]].sort(()=>Math.random()-.5),o=[9,18,24,31];let n=0,bad=0;
b.innerHTML=`<div class="grid" style="grid-template-columns:repeat(2,1fr)">${rm.map(r=>`<button class="tile" style="aspect-ratio:auto;padding:18px;font-size:1.1rem">${r[0]}<br><b>${r[1]} µSv/h</b></button>`).join('')}</div>`;
b.querySelectorAll('.tile').forEach((x,i)=>x.onclick=()=>{if(x.classList.contains('done'))return;if(rm[i][1]==o[n]){x.classList.add('done');n++;if(n==4)setTimeout(()=>cb(Math.max(0,1-bad/4)),500)}else{bad++;x.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],200)}})})}};

function storm(sev){
let t=12,g={w:0,f:0,e:0,x:0};
draw(`${dots()}<h2>⚡ Storm time!</h2>${zeph('Tap the supplies 💧 🌾 🔋 before they blow away. Dodge the sparks ⚡!')}<p class="mute" style="text-align:center">Time left: <b id="tm">12</b></p><div class="arena" id="ar"></div>`);
const ar=document.getElementById('ar'),sp=setInterval(()=>{const k=['💧','🌾','🔋','⚡','💧','🔋'][rnd(0,5)],d=document.createElement('div');d.className='it'+(k=='⚡'?' bad':'');d.textContent=k;d.style.left=rnd(3,84)+'%';d.onpointerdown=()=>{if(k=='💧')g.w++;else if(k=='🌾')g.f++;else if(k=='🔋')g.e++;else g.x++;d.remove()};d.onanimationend=()=>d.remove();ar.appendChild(d)},480);
const tk=setInterval(()=>{t--;document.getElementById('tm').textContent=t;if(t<=0){clearInterval(sp);clearInterval(tk);hit()}},1000);
function hit(){const bf={...S.r};ap({w:g.w*3,f:g.f*3,e:g.e*3,s:-g.x*6});let m;
if(S.r.s>=sev){ap({s:-8});m='Our shield held strong! The crew barely felt a thing.'}else{ap({e:-12,t:-10,o:-6});m='Radiation slipped inside. Some systems flickered and the crew got scared.'}
S.log.push({st:1});
draw(`${dots()}<h2>The storm passed</h2><div class="glass"><p>You grabbed 💧${g.w} 🌾${g.f} 🔋${g.e}${g.x?` and got zapped by ${g.x} spark${g.x>1?'s':''}`:''}.</p></div>${zeph(m)}<div class="glass">${diff(bf)}</div><button class="go" id="n">Night falls 🌙</button>`);
document.getElementById('n').onclick=night}}

function night(){
const D=DAYS[S.day],ev=S.log.filter(l=>l.e!==undefined&&(D.ev||[]).includes(l.e)),L=(D.ev||[]).map(i=>EV[i].l);
if(D.st)L.push('storm alerts come from satellites watching the Sun, and hiding in time protects your body');
L.push('sometimes there is no perfect answer, only choices with consequences');
let pl=null,pm=null,sk='';
const sum=()=>[...ev.map(l=>'I decided to '+l.t.charAt(0).toLowerCase()+l.t.slice(1)),...(D.st?['I survived a big storm']:[])].join(', and ')+'.';
const letter=()=>`Dear ${S0.dest},<br>Today on Mars, ${sum()}<br>Today I learned that ${pl!==null?L[pl]:'…'}.<br>I’m feeling ${pm!==null?MOOD[pm]:'…'}.<br>Sending you a big hug from another planet!<br>${S0.name} ${S0.emb} ${sk}`;
draw(`${dots()}<h2>🌙 Night ${S.day+1} · Letter to Earth</h2>${zeph('Time to write home! Your letter is writing itself. Just tap what you want to say. (It will take 4 to 24 minutes to reach Earth!)')}
<div class="glass"><h3>Today I learned that…</h3>${L.map((l,i)=>`<button class="opt" data-l="${i}"><span class="em">💡</span><span>${l}</span></button>`).join('')}<h3>I’m feeling…</h3><div class="row">${MOOD.map((m,i)=>`<button class="chip" data-m="${i}">${m}</button>`).join('')}</div><h3 style="margin-top:14px">Add a sticker</h3><div class="row">${STK.map(s=>`<button class="chip" data-s="${s}">${s}</button>`).join('')}</div></div>
<div class="paper" id="lt"></div><button class="go" id="sd" disabled>Send to Earth ✉️</button>`);
const up=()=>{document.getElementById('lt').innerHTML=letter();app.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l==pl));app.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m==pm));app.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s==sk));document.getElementById('sd').disabled=pl===null||pm===null};
app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{pl=+b.dataset.l;up()});
app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{pm=+b.dataset.m;up()});
app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sk=sk==b.dataset.s?'':b.dataset.s;up()});
up();
document.getElementById('sd').onclick=()=>{S.letters.push(letter());S.day++;if(S.day>=7)end();else dawn()}}

function end(dead){
const avg=Math.round(R.reduce((a,x)=>a+S.r[x[0]],0)/6),min=Math.min(...R.map(x=>S.r[x[0]]));
let tt,tx;
if(dead){tt='The lights go quiet';tx=`${dead=='t'?'The crew lost their team spirit':'You ran out of '+R.find(x=>x[0]==dead)[1].toLowerCase()}, and Ember Base had to shut down. But every letter you wrote made it home, and explorers who read them will do better next time.`}
else if(avg>=55&&min>20){tt='The lights stay on!';tx=`${S0.name}, you did it! The whole crew is going home together. Every choice had a cost, and you still found a way.`}
else{tt='Home with dusty boots';tx='You made it, but the base is battered and a friend is still upset. There was never a perfect answer. You were brave enough to choose.'}
draw(`<h1>${tt}</h1>${zeph(tx)}<div class="glass"><div class="rings">${R.map(x=>`<div><div class="ring" style="--c:${x[4]};--p:${S.r[x[0]]}"><div>${x[3]}</div></div><b>${x[1]}</b><small>${S.r[x[0]]}%</small></div>`).join('')}</div></div>
<h2>Your letter album 💌</h2>${S.letters.map(l=>`<div class="paper">${l}</div>`).join('')||'<p class="mute">There wasn’t time to write.</p>'}<button class="go" id="again">Play again with different choices</button>`);
document.getElementById('again').onclick=setup}
setup();
</script>
</body>
</html>
